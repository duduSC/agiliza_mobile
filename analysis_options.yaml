# Análise estática (Constituição 7.1): `scripts/flutter.sh analyze` deve sair
# sem erros nem avisos.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - build/**
    # Áreas locais de trabalho do agente (fora do git).
    - _rascunhos/**
    - _wt_*/**

linter:
  rules:
    # Proibido print/debugPrint com dado sensível (Constituição 6.4): o app não usa print.
    avoid_print: true
    prefer_const_constructors: true
    prefer_final_locals: true
    unawaited_futures: true
    cancel_subscriptions: true
    always_declare_return_types: true
