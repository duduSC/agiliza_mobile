# Memória limitada: o build roda dentro da VM do Docker Desktop (WSL2), que
# nesta máquina (7,7 GB de RAM) tem pouca memória. O padrão do template
# (-Xmx8G) derrubou a VM no primeiro build da T001.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
